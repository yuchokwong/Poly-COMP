[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsr"
version = "0.1.0"
description = "Domain-Specific Text-to-Image Retrieval with OpenCLIP (COMP5523)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "COMP5523 Group" }]

dependencies = [
    "torch>=2.2",
    "open_clip_torch>=2.24.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26",
    "pillow>=10.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]
cpu = ["onnx>=1.16", "onnxruntime>=1.17", "onnxscript>=0.1"]  # tsr export-onnx
nlp = ["transformers>=4.40", "sentencepiece>=0.2"]  # translate / caption / cross-encoder

[project.scripts]
tsr = "tsr.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["tsr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
