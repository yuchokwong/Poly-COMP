<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#475569"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">How it works: Text-to-Image Retrieval</text>
  <text x="550" y="72" text-anchor="middle" font-size="14" fill="#64748b">CLIP puts text and images in the same vector space; retrieval = nearest-neighbour search</text>

  <!-- inputs -->
  <rect x="40" y="150" width="150" height="66" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="115" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Text query</text>
  <text x="115" y="201" text-anchor="middle" font-size="11" fill="#475569">"a dog on a beach"</text>

  <rect x="40" y="352" width="150" height="66" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="383" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Gallery</text>
  <text x="115" y="403" text-anchor="middle" font-size="11" fill="#475569">50,000 images</text>

  <!-- encoders -->
  <rect x="250" y="150" width="180" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="340" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">CLIP text encoder</text>
  <text x="340" y="201" text-anchor="middle" font-size="11" fill="#475569">&#8594; text vector</text>

  <rect x="250" y="352" width="180" height="66" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="340" y="383" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">CLIP image encoder</text>
  <text x="340" y="403" text-anchor="middle" font-size="11" fill="#475569">&#8594; image vectors</text>

  <!-- shared space -->
  <rect x="490" y="205" width="200" height="210" rx="14" fill="#faf5ff" stroke="#c084fc" stroke-width="1.8"/>
  <text x="590" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">Shared vector</text>
  <text x="590" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">space (512-d)</text>
  <circle cx="590" cy="315" r="8" fill="#3b82f6"/>
  <text x="606" y="320" font-size="11" fill="#334155">query vector</text>
  <circle cx="560" cy="360" r="6" fill="#22c55e"/>
  <circle cx="625" cy="335" r="6" fill="#22c55e"/>
  <circle cx="600" cy="385" r="6" fill="#22c55e"/>
  <circle cx="540" cy="330" r="6" fill="#22c55e"/>
  <text x="590" y="405" text-anchor="middle" font-size="10.5" fill="#475569">image vectors (nearest = best match)</text>

  <!-- search -->
  <rect x="750" y="255" width="150" height="110" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="825" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Cosine</text>
  <text x="825" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">similarity</text>
  <text x="825" y="342" text-anchor="middle" font-size="11" fill="#78350f">FAISS search</text>

  <!-- results -->
  <rect x="950" y="255" width="115" height="110" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1007" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Top-K</text>
  <text x="1007" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">images</text>
  <text x="1007" y="342" text-anchor="middle" font-size="11" fill="#475569">ranked</text>

  <!-- arrows -->
  <line x1="190" y1="183" x2="250" y2="183" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="190" y1="385" x2="250" y2="385" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="430" y1="183" x2="512" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="430" y1="385" x2="512" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="690" y1="310" x2="750" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="900" y1="310" x2="950" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- notes -->
  <text x="450" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Key idea</text>
  <text x="450" y="498" text-anchor="middle" font-size="12.5" fill="#334155">CLIP is trained so that a caption and its matching image land close together.</text>
  <text x="450" y="520" text-anchor="middle" font-size="12.5" fill="#334155">So a text query can be compared directly with every image vector by cosine similarity.</text>
  <text x="450" y="546" text-anchor="middle" font-size="11" fill="#94a3b8">(Offline: image vectors are pre-computed once and stored in the FAISS index.)</text>
</svg>
